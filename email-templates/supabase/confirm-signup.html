<!-- Supabase: Authentication → Confirm sign up -->
<!-- Subject: Confirm your Atlas account -->

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f6f8fb;margin:0;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border:1px solid #d8dee6;border-radius:8px;overflow:hidden;">
        <tr>
          <td style="padding:28px 32px 20px;border-bottom:3px solid #c9a84c;">
            <p style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#5b6576;">Atlas by PrismJet</p>
            <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:400;line-height:1.2;color:#111827;">Confirm your email</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px;">
            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#111827;">
              Thanks for signing up. Please confirm your email address to finish creating your Atlas account.
            </p>
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 28px;">
              <tr>
                <td style="border-radius:6px;background-color:#c9a84c;">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#111827;text-decoration:none;">Confirm email</a>
                </td>
              </tr>
            </table>
            <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6576;">
              If you didn't create an account, you can safely ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 24px;border-top:1px solid #d8dee6;background-color:#f6f8fb;">
            <p style="margin:0;font-size:12px;line-height:1.5;color:#5b6576;text-align:center;">
              PrismJet · <a href="https://www.prismjet.space" style="color:#5b6576;text-decoration:underline;">prismjet.space</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
