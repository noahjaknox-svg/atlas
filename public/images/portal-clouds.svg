  <ellipse cx="900" cy="380" rx="360" ry="110" fill="rgba(255,255,255,0.42)" filter="url(#blur)"/>
  <ellipse cx="1400" cy="480" rx="320" ry="100" fill="rgba(255,255,255,0.38)" filter="url(#blur)"/>
  <ellipse cx="1100" cy="620" rx="400" ry="95" fill="rgba(255,255,255,0.28)" filter="url(#blur)"/>
